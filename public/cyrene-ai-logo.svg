<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" width="100" height="100">
  <defs>
    <linearGradient id="cyreneGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ec4899;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Geometric Crystal Shape -->
  <g opacity="0.95">
    <!-- Top pyramid -->
    <polygon points="50,15 65,35 35,35" fill="url(#cyreneGradient)" stroke="#a78bfa" stroke-width="0.5"/>
    
    <!-- Middle layer -->
    <polygon points="30,38 70,38 75,55 25,55" fill="url(#cyreneGradient)" stroke="#a78bfa" stroke-width="0.5" opacity="0.85"/>
    
    <!-- Bottom layer -->
    <polygon points="25,57 75,57 85,80 15,80" fill="url(#cyreneGradient)" stroke="#a78bfa" stroke-width="0.5" opacity="0.75"/>
    
    <!-- Inner glow -->
    <circle cx="50" cy="45" r="15" fill="#06b6d4" opacity="0.3"/>
  </g>
</svg>
