<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" width="100" height="100">
  <defs>
    <linearGradient id="solanaGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ec4899;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Solana chevron arrows -->
  <g opacity="0.95">
    <!-- Top chevron -->
    <path d="M 25 30 L 50 50 L 75 30" fill="none" stroke="url(#solanaGradient)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Middle chevron -->
    <path d="M 25 50 L 50 70 L 75 50" fill="none" stroke="url(#solanaGradient)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Bottom chevron -->
    <path d="M 25 70 L 50 90 L 75 70" fill="none" stroke="url(#solanaGradient)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
